# =============================================================================
# MAPPING ACCORDING TO ARCSIGHT'S ePO TABLE  (SIEM field <- ePO field)
# =============================================================================

# Device Vendor <- Trellix
event.deviceVendor=__stringConstant("Trellix")
# Device Product <- AnalyzerName  (fallback: Analyzer)
event.deviceProduct=__oneOf(AnalyzerName,Analyzer)
# Device Version <- AnalyzerVersion
event.deviceVersion=AnalyzerVersion
# Device Event Class ID <- ThreatEventID
event.deviceEventClassId=ThreatEventID
# Name <- Name (event description from ePO)  (fallback: ThreatName, ThreatEventID)
event.name=__oneOf(Name,ThreatName,ThreatEventID)
# Device Severity <- ThreatSeverity
event.deviceSeverity=ThreatSeverity
# Device Event Category <- ThreatCategory
event.deviceEventCategory=ThreatCategory
# Device Action <- ThreatActionTaken
event.deviceAction=ThreatActionTaken
# External ID <- AutoID
event.externalId=AutoID

# Device Receipt Time <- DetectedUTC
event.deviceReceiptTime=__createOptionalTimeStampFromString(DetectedUTC,"yyyy-MM-dd'T'HH:mm:ssXXX","yyyy-MM-dd'T'HH:mm:ss.SSSXXX","yyyy-MM-dd'T'HH:mm:ss")
# Start Time <- GeneratedTime  (fallback: DetectedUTC)
event.startTime=__createOptionalTimeStampFromString(__oneOf(GeneratedTime,DetectedUTC),"yyyy-MM-dd'T'HH:mm:ssXXX","yyyy-MM-dd'T'HH:mm:ss.SSSXXX","yyyy-MM-dd'T'HH:mm:ss")
# End Time: set by ESM ("Mapped properly by ESM Console") - not mapped here

# Device Address <- ServerIPAddress  (the ePO server)
event.deviceAddress=ServerIPAddress
# Device Host Name <- ServerHostName  (the ePO server)
event.deviceHostName=ServerHostName

# Source Address <- SourceIPV4
event.sourceAddress=SourceIPV4
# Source Host Name <- SourceHostName
event.sourceHostName=SourceHostName
# Source MAC Address <- SourceMAC
event.sourceMacAddress=SourceMAC
# Source Port <- LoadBalanceHttpPort  (fallback: SourcePort if load_balance_http_port is not set)
event.sourcePort=__oneOf(LoadBalanceHttpPort,SourcePort)
# Source Process Name <- SourceProcessName
event.sourceProcessName=SourceProcessName
# Source User Name <- SourceUserName
event.sourceUserName=SourceUserName

# Destination Address <- TargetIPV4
event.destinationAddress=TargetIPV4
# Destination Host Name <- TargetHostName
event.destinationHostName=TargetHostName
# Destination MAC Address <- TargetMAC
event.destinationMacAddress=TargetMAC
# Destination Port <- TargetPort
event.destinationPort=TargetPort
# Destination Process Name <- TargetProcessName
event.destinationProcessName=TargetProcessName
# Destination User Name <- TargetUserName
event.destinationUserName=TargetUserName

# File Hash <- TargetHash
event.fileHash=TargetHash
# File Name <- TargetFileName  (fallback: TargetName)
event.fileName=__oneOf(TargetFileName,TargetName)

# Old File * <- system properties (same format as ArcSight's ePO connector)
event.oldFileId=__ifThenElse(SystemSerialNumber,,,__concatenate("System Serial Number : ",SystemSerialNumber))
event.oldFileName=__ifThenElse(EmailAddress,,,__concatenate("Email Address : ",EmailAddress))
event.oldFilePath=__ifThenElse(PlatformID,,,__concatenate("Platform ID : ",PlatformID))
event.oldFilePermission=__ifThenElse(SystemManufacturer,,,__concatenate("System Manufacturer : ",SystemManufacturer))
event.oldFileType=__ifThenElse(SystemModel,,,__concatenate("System Model : ",SystemModel))

# Device Custom Number 1 <- TenantId
event.deviceCustomNumber1=TenantId
event.deviceCustomNumber1Label=__stringConstant("TenantId")
# Device Custom Number 2 <- AnalyzerDATVersion (integer part, e.g. 10567.0000 -> 10567)
event.deviceCustomNumber2=AnalyzerDATVersionNum
event.deviceCustomNumber2Label=__stringConstant("Analyzer DAT Version")
# Device Custom String 1 <- ThreatName
event.deviceCustomString1=ThreatName
event.deviceCustomString1Label=__stringConstant("Threat Name")
# Device Custom String 2 <- ThreatType
event.deviceCustomString2=ThreatType
event.deviceCustomString2Label=__stringConstant("Threat Type")
# Device Custom String 3 <- CatalogProductName  (fallback: AnalyzerName)
event.deviceCustomString3=__oneOf(CatalogProductName,AnalyzerName)
event.deviceCustomString3Label=__stringConstant("Catalog Product Name")
# Device Custom String 4 <- AnalyzerDetectionMethod
event.deviceCustomString4=AnalyzerDetectionMethod
event.deviceCustomString4Label=__stringConstant("Analyzer Detection Method")
# Device Custom String 5 <- AnalyzerEngineVersion
event.deviceCustomString5=AnalyzerEngineVersion
event.deviceCustomString5Label=__stringConstant("Analyzer Engine Version")

# =============================================================================
# EARLIER MAPPINGS NOT IN ARCSIGHT'S TABLE (kept)
# =============================================================================

# Device Custom Date 1 <- ReceivedUTC (when ePO received the event)
event.deviceCustomDate1=__createOptionalTimeStampFromString(ReceivedUTC,"yyyy-MM-dd'T'HH:mm:ssXXX","yyyy-MM-dd'T'HH:mm:ss.SSSXXX","yyyy-MM-dd'T'HH:mm:ss")
event.deviceCustomDate1Label=__stringConstant("ePO Received Time")
# Device External ID <- AgentGUID
event.deviceExternalId=AgentGUID
# Event Outcome <- ThreatHandled: true = /Success, false = /Failure
event.categoryOutcome=__ifThenElse(ThreatHandled,"true","/Success","/Failure")
# Device Custom Number 3 <- ThreatHandled (1/0)   [moved from cn2]
event.deviceCustomNumber3=__safeToLong(__ifThenElse(ThreatHandled,"true","1","0"))
event.deviceCustomNumber3Label=__stringConstant("Threat Handled (1=Yes 0=No)")
# Message <- NaturalLangDescription  (fallback: ThreatName)
event.message=__oneOf(NaturalLangDescription,ThreatName)
# Device Facility <- BladeName  (fallback: Analyzer)
event.deviceFacility=__oneOf(BladeName,Analyzer)
# Device MAC Address <- AnalyzerMAC (the reporting client)
event.deviceMacAddress=AnalyzerMAC
# Request URL <- SourceURL (fallback: TargetURL)
event.requestUrl=__oneOf(SourceURL,TargetURL)
# Transport Protocol <- TargetProtocol
event.transportProtocol=TargetProtocol
# File Path <- TargetPath (fallback: TargetFileName)
event.filePath=__oneOf(TargetPath,TargetFileName)
# File Size <- TargetFileSize
event.fileSize=TargetFileSize
# Old File Hash <- SourceHash
event.oldFileHash=SourceHash
# Reason <- AnalyzerRuleName   [moved from cs4]
event.reason=AnalyzerRuleName
# Device Custom String 6 <- SourceProcessHash
event.deviceCustomString6=SourceProcessHash
event.deviceCustomString6Label=__stringConstant("Source Process Hash")
# Flex String 1 <- SourceParentProcessName
event.flexString1=SourceParentProcessName
event.flexString1Label=__stringConstant("Parent Process")
# Flex String 2 <- AnalyzerRuleID
event.flexString2=AnalyzerRuleID
event.flexString2Label=__stringConstant("Rule ID")

# =============================================================================
# Agent (Connector) Severity <- ThreatSeverity: 0,1,2 = High; 3,4 = Medium; 5,6,7 = Low
# =============================================================================
severity.map.high.if.deviceSeverity=0,1,2
severity.map.medium.if.deviceSeverity=3,4
severity.map.low.if.deviceSeverity=5,6,7

