#  Changelog
#  1.3.0  2026-11-13  All comments in English.
#  1.2.1  2026-11-13  MIT license. Published on GitHub.
#  1.2.0  2026-11-05  Mapping according to ArcSight's ePO table (VSE 8.8 / ePO 5.10):
#                     dvc/dvchost = the ePO server, spt = LoadBalanceHttpPort,
#                     deviceProduct = AnalyzerName, name = event description,
#                     cs1-cs5/cn1-cn2 and oldFile* per the table, start = GeneratedTime,
#                     severity 0-2 High, 3-4 Medium, 5-7 Low.
#                     Displaced mappings moved: ThreatHandled -> cn3,
#                     AnalyzerRuleName -> reason. The rest to Additional Data.
#  1.1.0  2026-11-05  MAC fields have the type MacAddress (dvcmac, smac, dmac).
#                     ThreatHandled also to cn2 (1/0) in addition to outcome.
#  1.0.0  2026-10-21  First version: 111 tokens, CEF mapping, severity mapping,
#                     other fields to Additional Data.
# =============================================================================
# ArcSight FlexConnector - JSON Folder Follower for Trellix ePO threat events
# Reads files from epo_fetch_events.py:  {"meta": {...}, "events": [ {...}, ... ]}
#
# Assumes strip_table_prefix=true (fields are named "ThreatName", not "EPOEvents.ThreatName").
# The script decodes IPv4, normalizes MAC to 00:11:22:AA:BB:CC and ThreatHandled to
# "true"/"false", and enriches with the ePO server, system properties and event description.
# Fields missing from an event stay empty.
#
# Installation: copy to <ARCSIGHT_HOME>/current/user/agent/flexagent/
#               and enter "trellix_epo" as the Configuration File.
# =============================================================================

